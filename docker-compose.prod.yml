services:
  backend:
    image: evergreen93/bbs-backend:latest
    container_name: bbs-backend
    ports:
      - "3000:3000"
    environment:
      MYSQLUSER: ${MYSQLUSER}
      MYSQLPASSWORD: ${MYSQLPASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  frontend:
    image: evergreen93/bbs-frontend:latest
    container_name: bbs-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped